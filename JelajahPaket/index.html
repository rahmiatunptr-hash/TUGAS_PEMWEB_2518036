<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JelajahPaket - Beranda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: transparent; }
        .logo { font-size: 24px; font-weight: bold; color: #0288d1; display: flex; align-items: center; gap: 10px; }
        .logo img { width: 28px; height: 28px; object-fit: contain; }
        .logo span { color: #333; }
        
        nav a { margin-left: 25px; text-decoration: none; color: #333; font-weight: 500; transition: color 0.3s; cursor: pointer; }
        nav a:hover { color: #0288d1; }
        .btn-login { background: #00b0ff; color: white; padding: 8px 22px; border-radius: 20px; text-decoration: none; font-weight: 500; box-shadow: 0 4px 10px rgba(0, 176, 255, 0.3); }
        .btn-login:hover { background: #0091ea; }
        
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 40px 8%; flex: 1; }
        .hero-content { max-width: 550px; }
        .hero-content h1 { font-size: 42px; color: #1a237e; line-height: 1.2; margin-bottom: 20px; }
        .hero-content p { font-size: 15px; color: #555; margin-bottom: 25px; line-height: 1.5; }
        .btn-cta { display: inline-block; background: #00b0ff; color: white; padding: 12px 28px; border-radius: 25px; text-decoration: none; font-weight: bold; box-shadow: 0 5px 15px rgba(0, 176, 255, 0.4); transition: transform 0.2s; }
        .btn-cta:hover { transform: translateY(-2px); background: #0091ea; }
        
        .hero-image { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 400px; }
        .hero-image h3 { color: #0288d1; margin-bottom: 15px; font-size: 16px; }

        /* --- TOAST / SNACKBAR STYLING --- */
        #toast-notification {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 14px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast-notification.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        /* --- DARK MODE STYLING --- */
        .dark-mode { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important; }
        .dark-mode .hero-image { background: #1e293b; color: white; }
        .dark-mode .hero-content h1 { color: #38bdf8; }
        .dark-mode .hero-content p { color: #cbd5e1; }
        .dark-mode nav a { color: #f8fafc; }
    </style>
</head>
<body id="main-body">
    <header>
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/3063/3063823.png" alt="Logo Paket">
            <span>JelajahPaket</span>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a onclick="ubahJudulDOM(event)">Tentang</a>
            <a onclick="toggleDarkModeDOM(event)">Ubah Tema</a>
            <a href="login.html" class="btn-login">Login</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1 id="hero-title">Pantau Perjalanan Paketmu dengan Mudah</h1>
            <p id="hero-desc">Kelola dan pantau proses logistik serta distribusi barang dalam satu aplikasi yang cepat, aman, dan terpercaya.</p>
            <a href="#" class="btn-cta" onclick="triggerToastDOM(event)">Mulai sekarang &rarr;</a>
        </div>
        <div class="hero-image">
            <h3 id="box-title">Sistem Logistik Terpadu</h3>
            <img src="https://cdni.iconscout.com/illustration/premium/thumb/delivery-truck-with-location-pin-illustration-download-in-svg-png-gif-file-formats--shipping-map-navigation-pack-logistics-illustrations-4395610.png" alt="Ilustrasi Truk" style="width: 100%; height: auto; border-radius: 8px;">
        </div>
    </section>

    <!-- Elemen Toast / Snackbar -->
    <div id="toast-notification">Selamat datang di aplikasi JelajahPaket!</div>

    <script>
        // DOM 1: Mengubah teks judul utama secara dinamis
        function ubahJudulDOM(e) {
            e.preventDefault();
            const judul = document.getElementById('hero-title');
            judul.innerText = "Solusi Logistik Modern & Terpadu untuk Anda!";
            tampilkanToast("DOM 1: Judul utama berhasil diubah!");
        }

        // DOM 2: Mengubah tema halaman (Dark Mode / Light Mode)
        function toggleDarkModeDOM(e) {
            e.preventDefault();
            const body = document.getElementById('main-body');
            body.classList.toggle('dark-mode');
            tampilkanToast("DOM 2: Tema tampilan berhasil diganti!");
        }

        // DOM 3: Interaksi klik tombol CTA dan menampilkan Toast/Snackbar (Tanpa Framework)
        function triggerToastDOM(e) {
            e.preventDefault();
            const box = document.getElementById('box-title');
            box.innerText = "Status: Siap Melacak!"; // Manipulasi DOM ke-3
            tampilkanToast("DOM 3 & Toast: Sistem pelacakan diaktifkan!");
        }

        // Fungsi Toast / Snackbar murni JavaScript
        function tampilkanToast(pesan) {
            const toast = document.getElementById("toast-notification");
            toast.innerText = pesan;
            toast.className = "show";
            setTimeout(function() { 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
