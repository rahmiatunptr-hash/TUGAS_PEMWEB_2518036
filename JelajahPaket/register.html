<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JelajahPaket - Buat Akun</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #e3f2fd 0%, #90caf9 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .auth-card { background: #ffffff; width: 420px; padding: 35px 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #0288d1; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .logo img { width: 28px; height: 28px; object-fit: contain; }
        .logo span { color: #333; }
        .auth-card h2 { font-size: 18px; color: #333; margin-bottom: 5px; }
        .auth-subtitle { font-size: 12px; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group input { width: 100%; padding: 11px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #00b0ff; }
        .btn-submit { width: 100%; background: #00b0ff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,176,255,0.3); }
        .btn-submit:hover { background: #0091ea; }
        .auth-link { margin-top: 18px; font-size: 13px; color: #555; }
        .auth-link a { color: #00b0ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/3063/3063823.png" alt="Logo Paket">
            <span>JelajahPaket</span>
        </div>
        <h2>Buat Akun</h2>
        <p class="auth-subtitle">Daftar untuk menggunakan layanan JelajahPaket</p>
        <form action="login.html" method="GET">
            <div class="form-group">
                <input type="text" placeholder="Nama Lengkap" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="tel" placeholder="Nomor Telepon" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Konfirmasi Password" required>
            </div>
            <button type="submit" class="btn-submit">Daftar</button>
        </form>
        <div class="auth-link">
            Sudah punya akun? <a href="login.html">Masuk</a>
        </div>
    </div>
</body>
</html>
